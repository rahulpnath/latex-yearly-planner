addlasthalfhour: false

layout:
  paper:
    # The months/quarters rail is a rotated marginnote, so this layout does need
    # a wide margin on one side (marginparwidth 1cm + marginparsep 4.5mm).
    margin:
      left: 1.45cm
      right: .3cm

  numbers:
    dailybottomhour: 6
    dailytophour: 23
    dailynotes: 26
    # Narrower text block than the breadcrumb layout, so one fewer dot column.
    dotwidthfull: 29
    dotwidthtwothirds: 19

  lengths:
    headersidecellheight: "[1.35ex]"
    headersidequarterswidth: 4cm
    headersidemonthswidth: 15.25cm
